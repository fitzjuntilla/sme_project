<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MILA Internet Cafe - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme-override.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>MILA Internet Cafe</h1>

            <p class="login-subtitle">
                Management System
            </p>

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
